<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0c1120">
  <meta name="apple-mobile-web-app-title" content="클래스 티어">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <title>클래스 티어</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 1.8 20.5 5v6.2c0 5.6-3.6 9.7-8.5 11.2C7.1 20.9 3.5 16.8 3.5 11.2V5z' fill='%23f2bf3c' stroke='%237a4a05'/%3E%3Cpath d='M12 6.4l1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z' fill='%23fff6cf'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tier.css">
  <link rel="stylesheet" href="css/econ.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-bronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3b27e"/><stop offset=".55" stop-color="#b8672f"/><stop offset="1" stop-color="#6e3714"/></linearGradient>
      <linearGradient id="g-silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#b9c3d1"/><stop offset="1" stop-color="#6b7688"/></linearGradient>
      <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2b0"/><stop offset=".5" stop-color="#f2bf3c"/><stop offset="1" stop-color="#a86b0c"/></linearGradient>
      <linearGradient id="g-platinum" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8fff9"/><stop offset=".5" stop-color="#3fd1c2"/><stop offset="1" stop-color="#127a73"/></linearGradient>
      <linearGradient id="g-diamond" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6f0ff"/><stop offset=".45" stop-color="#6ea2ff"/><stop offset="1" stop-color="#8f4dff"/></linearGradient>
      <linearGradient id="g-champion" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3a6"/><stop offset=".5" stop-color="#ffc43d"/><stop offset="1" stop-color="#e2562e"/></linearGradient>
      <linearGradient id="g-placement" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa6c4"/><stop offset="1" stop-color="#4a5572"/></linearGradient>
    </defs>
  </svg>

  <section id="scr-loading" class="screen center">
    <div class="loader tier-loader">
      <svg viewBox="0 0 24 24"><path d="M12 1.8 20.5 5v6.2c0 5.6-3.6 9.7-8.5 11.2C7.1 20.9 3.5 16.8 3.5 11.2V5z" fill="url(#g-bronze)" stroke="#4a230c" stroke-width=".8"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 1.8 20.5 5v6.2c0 5.6-3.6 9.7-8.5 11.2C7.1 20.9 3.5 16.8 3.5 11.2V5z" fill="url(#g-silver)" stroke="#4d5668" stroke-width=".8"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 1.8 20.5 5v6.2c0 5.6-3.6 9.7-8.5 11.2C7.1 20.9 3.5 16.8 3.5 11.2V5z" fill="url(#g-gold)" stroke="#7a4a05" stroke-width=".8"/><path d="M12 6.4l1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z" fill="#fff6cf"/></svg>
      <svg viewBox="0 0 24 24"><path d="M6.3 3h11.4L22.2 9 12 22.2 1.8 9z" fill="url(#g-diamond)" stroke="#2e1f7a" stroke-width=".8"/></svg>
    </div>
    <p class="muted" id="loading-msg">불러오는 중…</p>
  </section>

  <section id="scr-login" class="screen center hidden">
    <div class="auth-card">
      <div class="logo-tier" id="login-logo"></div>
      <h1 id="login-title">클래스 티어</h1>
      <p class="muted">우리 반 생활 종합 티어 · 매달 새 시즌</p>
      <form id="login-form" autocomplete="on">
        <label>아이디<input id="login-id" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
        <label>비밀번호<input id="login-pw" type="password" autocomplete="current-password" required></label>
        <button class="btn primary lg" type="submit">입장하기</button>
        <p class="err" id="login-err"></p>
      </form>
      <div class="google-only hidden">
        <div class="or-line"><span>선생님은</span></div>
        <button class="btn google lg" id="login-google" type="button"><svg class="g-logo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Google 계정으로 로그인</button>
      </div>
      <button class="btn ghost sm install-btn hidden" data-install="1" type="button">📲 이 기기에 앱으로 설치</button>
      <div class="demo-note hidden" id="demo-note">
        <b>데모 모드</b> — Firebase가 연결되지 않아 이 브라우저에만 저장됩니다.
        <button class="btn ghost sm" id="demo-reset">데모 데이터 초기화</button>
      </div>
    </div>
  </section>

  <section id="scr-setup" class="screen center hidden">
    <div class="auth-card">
      <div class="logo-tier" id="setup-logo"></div>
      <h1>처음 설정</h1>
      <p class="muted">선생님 계정을 만듭니다. 아이디는 <b>teacher</b> 입니다.</p>
      <form id="setup-form">
        <label>반 이름<input id="setup-class" required placeholder="예: 5학년 3반"></label>
        <label>선생님 표시 이름<input id="setup-name" required placeholder="예: 김선생님"></label>
        <label>비밀번호 (6자 이상)<input id="setup-pw" type="password" minlength="6" autocomplete="new-password" required></label>
        <label>비밀번호 확인<input id="setup-pw2" type="password" minlength="6" autocomplete="new-password" required></label>
        <button class="btn primary lg" type="submit">시작하기</button>
        <p class="err" id="setup-err"></p>
      </form>
      <div class="google-only hidden">
        <div class="or-line"><span>또는</span></div>
        <button class="btn google lg" id="setup-google" type="button"><svg class="g-logo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Google 계정으로 시작하기</button>
        <p class="muted" style="font-size:.82em;margin-top:8px">반 이름·선생님 표시 이름만 적고 누르면 돼요 (비밀번호 없이 Google로 로그인)</p>
      </div>
    </div>
  </section>

  <!-- 학생 -->
  <section id="scr-student" class="screen hidden">
    <header class="topbar">
      <div class="brand" id="st-brand"></div>
      <nav class="tabs secs" id="st-secs"></nav>
      <div class="top-me" id="st-me"></div>
      <button class="btn ghost sm" data-act="logout">로그아웃</button>
    </header>
    <nav class="subtabs" id="st-tabs"></nav>
    <main class="page" id="st-main"></main>
  </section>

  <!-- 선생님 -->
  <section id="scr-teacher" class="screen hidden">
    <header class="topbar">
      <div class="brand" id="tc-brand"></div>
      <nav class="tabs secs" id="tc-secs"></nav>
      <button class="btn ghost sm" data-act="logout">로그아웃</button>
    </header>
    <nav class="subtabs wide" id="tc-tabs"></nav>
    <main class="page wide" id="tc-main"></main>
  </section>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/firebase-config.js"></script>
  <script src="js/tier.js"></script>
  <script src="js/tracks.js"></script>
  <script src="js/hanja.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/app.js"></script>
  <script src="js/econ.js"></script>
  <script src="js/media.js"></script>
  <script src="js/hanja-study.js"></script>
  <script src="js/econ-student.js"></script>
  <script src="js/teacher.js"></script>
  <script src="js/econ-teacher.js"></script>
  <script src="js/prices.js"></script>
  <script src="js/quest.js"></script>
  <script src="js/board.js"></script>
  <script src="js/importer.js"></script>
</body>
</html>
