# 주식 시세 — 평일 장중(한국 시간 09:00~16:55)에는 5분마다, 그 밖에는 1시간마다 시세를 받아 prices 브랜치에 올립니다.
# 비밀 키가 필요 없습니다. (종목 목록은 Firebase 공개 경로 pub/symbols, 올리기는 GitHub가 주는 토큰)
# ※ 이 파일을 저장소의 .github/workflows/prices.yml 로 넣어야 동작합니다 (README 「실제 주식 시세」 참고).
name: 주식 시세
on:
  schedule:
    - cron: '*/5 0-7 * * 1-5'
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 시세 받기
        run: node tools/prices.mjs out/prices.json
        env:
          DB_URL: https://class-tier-default-rtdb.asia-southeast1.firebasedatabase.app
      - name: prices 브랜치에 올리기
        working-directory: out
        run: |
          git init -q -b prices
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -q -m "시세 $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" prices
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
